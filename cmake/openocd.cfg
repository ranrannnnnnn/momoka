# ===========================================================================
#  cmake/openocd.cfg
#  ST-Link/V2 + STM32F103C8T6（Cortex-M3，64 KB Flash / 20 KB RAM，LQFP48）
#
#  命令行用法：
#      openocd -f cmake/openocd.cfg
#    另开一个终端：
#      arm-none-eabi-gdb build/Debug/11.5.elf
#      (gdb) target extended-remote localhost:3333
#      (gdb) load
#      (gdb) monitor reset halt
#
#  CLion 用法：
#      Run > Edit Configurations > + > OpenOCD Download & Run
#      把 "Board config file" 指向本文件，其余保持默认即可。
#      （本项目已在 .run/ 里预置好这份配置，直接选它就行）
# ===========================================================================

# --- 1. 调试探针：ST-Link -------------------------------------------------
# 官方脚本，内部用 hla 驱动 + hla_layout stlink，
# 已包含 0x0483:3748 / 0x0483:374B 等 VID:PID。
source [find interface/stlink.cfg]

# --- 2. 传输方式：SWD -----------------------------------------------------
# SWD 只要两根信号线（SWDIO=PA13 / SWCLK=PA14），比 JTAG 省引脚。
# 不写这行 OpenOCD 也会自动挑 hla_swd，显式写出来便于以后排查。
transport select hla_swd

# SWD 时钟 1000 kHz。排线长或连不稳时降到 480 / 100 会更可靠。
adapter speed 1000

# --- 3. 目标芯片：STM32F1 系列 --------------------------------------------
# 该脚本按 IDCODE 自动识别 F103，并把 Flash bank 挂在 0x08000000，
# 容量由芯片自行探测（F103C8 应探测出 64 KB）。
# 它内部对 SWD 设了 `cortex_m reset_config sysresetreq`，
# 也就是用内核的 SYSRESETREQ 做软复位 —— 因此只接
# SWDIO / SWCLK / GND / VTref 四根线就能烧录和复位，不依赖 SRST 引脚。
source [find target/stm32f1x.cfg]